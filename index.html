<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">

    <title>CALULATOR</title>
</head>
<body>
    <div class="container">
    <div class="calculator">
 
            <div class="display">
                <input type="text" name="display" id="display" readonly> 
            </div>

            <div>
                <button type="button" onclick="clearDisplay()" class="btncol" >AC</button>
                <button type="button" onclick="deleteLast()" class="btncol">DEL</button>
                <button type="button" onclick="appendToDisplay('.')" class="btnOp" >.</button>
                <button type="button" onclick="appendToDisplay('/')"class="btnOp">/</button>
            </div>

            <div>
                <button type="button" onclick="appendToDisplay('7')">7</button>
                <button type="button" onclick="appendToDisplay('8')">8</button>
                <button type="button" onclick="appendToDisplay('9')">9</button>
                <button type="button" onclick="appendToDisplay('*')"class="btnOp">&times;</button>
            </div>

            <div>
                <button type="button" onclick="appendToDisplay('4')">4</button>
                <button type="button" onclick="appendToDisplay('5')">5</button>
                <button type="button" onclick="appendToDisplay('6')">6</button>
                <button type="button" onclick="appendToDisplay('-')"class="btnOp">-</button>
            </div>

            <div>
                <button type="button" onclick="appendToDisplay('1')">1</button>
                <button type="button" onclick="appendToDisplay('2')">2</button>
                <button type="button" onclick="appendToDisplay('3')">3</button>
                <button type="button" onclick="appendToDisplay('+')"class="btnOp">+</button>
            </div>

            <div>
                <button type="button" onclick="appendToDisplay('00')">00</button>
                <button type="button" onclick="appendToDisplay('0')">0</button>
                <button type="button" class="equal btnOp" onclick="calculate()">=</button>
            </div>


    </div>
</div>




  <script src="assets/js/script.js"></script>  
</body>
</html>
